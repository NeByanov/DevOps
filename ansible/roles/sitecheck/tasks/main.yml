#sitecheck
- name: Install curl for sitecheck
  ansible.builtin.apt:
    name: curl
    state: present
  become: true

- name: Create system user sitecheck
  ansible.builtin.user:
    name: sitecheck
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install sitecheck script
  ansible.builtin.template:
    src: sitecheck.sh.j2
    dest: /usr/local/bin/sitecheck
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Reload systemd

- name: Install sitecheck.service
  ansible.builtin.template:
    src: sitecheck.service.j2
    dest: /etc/systemd/system/sitecheck.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Install sitecheck.timer
  ansible.builtin.template:
    src: sitecheck.timer.j2
    dest: /etc/systemd/system/sitecheck.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Flush handlers before enabling timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start sitecheck.timer
  ansible.builtin.systemd:
    name: sitecheck.timer
    enabled: true
    state: started
  become: true

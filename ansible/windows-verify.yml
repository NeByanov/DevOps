---
- name: Windows verification
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: WinRM connectivity
      ansible.windows.win_ping:

    - name: Find all services that start with 'win'
      ansible.windows.win_service_info:
        name: winRM
      register: win_services_info

    - name: Проверить наличие WinRM на хосте
      ansible.builtin.assert:
        that:
          - win_services_info.exists
        fail_msg: "ERROR: WinRM нет на хосте"
        success_msg: "SUCCESS: Служба WinRM присутствует"
        quiet: true

    - name: Check running WinRM
      ansible.builtin.assert:
        that:
          - win_services_info.services[0].state == "started"
        fail_msg: "ERROR:Служба не запущена, текущее состояние {{ win_services_info.services[0].state }}"
        success_msg: "SUCCESS:Служба WinRM запущена"
        quiet: true

    - name: Check autorunning WinRM on host
      ansible.builtin.assert:
        that:
          - win_services_info.services[0].start_mode == "auto"
        fail_msg: "ERROR:Служба не запущена, текущее состояние {{ win_services_info.services[0].start_mode }}"
        success_msg: "SUCCESS:WinRM имеет автозапуск"
        quiet: true

    - name: Check HTTP CODE (200) 192.168.56.103:8081
      ansible.builtin.uri:
        url: iis_url
        method: GET
        timeout: 10
        status_code: 200
      delegate_to: localhost
      register: uri_check
      ignore_errors: true
      check_mode: false

    - name: Validate http check
      ansible.builtin.assert:
        that:
          - uri_check.status | default(0) == 200
        fail_msg: |
          Сервис недоступен или вернул неверный статус:
            - URL: iis_url
            - Статус: {{ uri_check.status | default('N/A') }}
            - Ошибка: {{ uri_check.msg | default('Нет сообщения об ошибке') }}
      check_mode: false

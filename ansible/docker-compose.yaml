services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_for_1c:/var/lib/postgresql/data
      - ./1c_role.sql:/docker-entrypoint-initdb.d/1c_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${HTTP_PORT:-5433}:5432"

volumes:
  postgres_data_for_1c:

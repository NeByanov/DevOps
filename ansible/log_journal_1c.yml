---
- name: Configure and verify 1C RAS
  hosts: windows_hosts
  gather_facts: false

  tasks:
    # --- Создание папки для логов ---
    - name: Create directory for journal
      ansible.windows.win_file:
        path: "{{ one_c_techlog_dir }}"
        state: directory
      register: directory_journal

    # --- ACL: отключить наследование, убрать Users, дать права svc_1c_lab ---
    - name: Disable inheritance on journal directory
      ansible.windows.win_acl_inheritance:
        path: "{{ one_c_techlog_dir }}"
        state: absent
        reorganize: true

    - name: Remove inherited Users rights (language-independent via SID)
      ansible.windows.win_shell: |
        icacls "{{ one_c_techlog_dir }}" /remove "*S-1-5-32-545"
      changed_when: false

    - name: ACL for journal directory (svc_1c_lab)
      ansible.windows.win_acl:
        path: "{{ one_c_techlog_dir }}"
        user: ".\\svc_1c_lab"
        type: allow
        rights: Modify
        inherit: ContainerInherit, ObjectInherit
        propagation: None
        state: present
    # --- Создание logcfg.xml ---
    - name: Ensure conf directory exists
      ansible.windows.win_file:
        path: "{{ one_c_platform_conf_dir }}"
        state: directory

    - name: Create logcfg.xml
      ansible.windows.win_copy:
        dest: "{{ one_c_platform_conf_dir }}/logcfg.xml"
        content: |
          <?xml version='1.0' encoding='UTF-8'?>
          <config xmlns="http://v8.1c.ru/v8/tech-log">
            <log location="{{ one_c_techlog_dir }}" history="4" placement="plain" format="json">
              <event>
                <eq property="Name" value="excp"/>
              </event>
              <event>
                <ne property="Name" value=""/>
                <ge property="Durationus" value="5000000"/>
              </event>
              <property name="all"/>
            </log>
          </config>
      register: logfile

    # --- ACL на файл logcfg.xml (чтобы svc_1c_lab мог читать) ---
    - name: ACL for logcfg.xml
      ansible.windows.win_acl:
        path: "{{ one_c_platform_conf_dir }}/logcfg.xml"
        user: ".\\svc_1c_lab"
        type: allow
        rights: ReadAndExecute
        state: present

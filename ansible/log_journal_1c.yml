---
- name: Create techLog for 1C
  hosts: windows_hosts
  gather_facts: false

  vars:
    history: 5
    duration_value: 15000000

  tasks:
    # --- Создание папки для логов ---
    - name: Create directory for journal
      ansible.windows.win_file:
        path: "{{ one_c_techlog_dir }}"
        state: directory
      register: directory_journal

    # --- ACL: отключить наследование, убрать Users, дать права svc_1c_lab ---
    - name: Disable inheritance on journal directory
      ansible.windows.win_acl_inheritance:
        path: "{{ one_c_techlog_dir }}"
        state: absent
        reorganize: true

    - name: Check if Users group (S-1-5-32-545) has rights
      ansible.windows.win_shell: |
        $acl = Get-Acl "{{ one_c_techlog_dir }}"
        $sid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
        $found = $acl.Access | Where-Object {
          try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) -eq $sid } catch { $false }
        }
        if ($found) { Write-Output "present" } else { Write-Output "absent" }
      register: users_acl_check
      changed_when: false

    - name: Remove inherited Users rights
      ansible.windows.win_shell: |
        icacls "{{ one_c_techlog_dir }}" /remove "*S-1-5-32-545"
      when: users_acl_check.stdout | trim == "present"
    # --- Создание logcfg.xml ---
    - name: Ensure conf directory exists
      ansible.windows.win_file:
        path: "{{ one_c_platform_conf_dir }}"
        state: directory

    - name: Create logcfg.xml
      ansible.windows.win_copy:
        dest: "{{ one_c_platform_conf_dir }}/logcfg.xml"
        content: |
          <?xml version='1.0' encoding='UTF-8'?>
          <config xmlns="http://v8.1c.ru/v8/tech-log">
            <log location="{{ one_c_techlog_dir }}" history="{{ history }}" placement="plain" format="json">
              <event>
                <eq property="Name" value="excp"/>
              </event>
              <event>
                <ne property="Name" value=""/>
                <ge property="Durationus" value="{{ duration_value }}"/>
              </event>
              <property name="all"/>
            </log>
          </config>
      register: logfile

    # --- ACL на файл logcfg.xml (чтобы svc_1c_lab мог читать) ---
    - name: ACL for logcfg.xml
      ansible.windows.win_acl:
        path: "{{ one_c_platform_conf_dir }}/logcfg.xml"
        user: ".\\svc_1c_lab"
        type: allow
        rights: ReadAndExecute
        state: present

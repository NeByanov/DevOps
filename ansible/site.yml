- name: Configure lab VM
  hosts: lab_vm1
  gather_facts: true

  tasks:
    - name: Install required packages
      become: true
      ansible.builtin.apt:
        name:
          - curl
          - jq
        state: present
        update_cache: true

    - name: Check Docker Compose availability
      become: false
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
      register: compose_version
      changed_when: false

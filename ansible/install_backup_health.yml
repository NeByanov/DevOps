---
- name: Install 1C backup health check
  hosts: lab_vm
  become: true

  vars:
    script_src: files/scripts/check_1c_backup.sh
    script_dest: /usr/local/bin/check_1c_backup.sh
    systemd_dir: /etc/systemd/system
    unit_files:
      - one-c-backup-health.service
      - one-c-backup-health.timer

  tasks:
    # ── Скрипт ──────────────────────────────────────────────────
    - name: Copy health check script
      ansible.builtin.copy:
        src: "{{ script_src }}"
        dest: "{{ script_dest }}"
        owner: root
        group: root
        mode: "0755"
      notify: Reload systemd

    # ── Unit-файлы ──────────────────────────────────────────────
    - name: Copy systemd unit files
      ansible.builtin.copy:
        src: "files/systemd/{{ item }}"
        dest: "{{ systemd_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ unit_files }}"
      notify: Reload systemd

    # ── Включение таймера ───────────────────────────────────────
    - name: Enable and start health timer
      ansible.builtin.systemd:
        name: one-c-backup-health.timer
        enabled: true
        state: started
        daemon_reload: true

    # ── Проверка (dry run, не падает если бэкапа ещё нет) ────────
    - name: Run health check manually to verify
      ansible.builtin.command: "{{ script_dest }}"
      register: health_result
      changed_when: false
      failed_when: false

    - name: Show health check result
      ansible.builtin.debug:
        msg: "{{ health_result.stdout_lines | default(['(no output)']) }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

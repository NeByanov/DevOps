---
# install_backup_health.yml
# Воспроизводимая установка скрипта проверки и systemd-юнитов.
# Идемпотентно. Проверка запускается в конце плейбука —
# если бэкапа ещё нет, плейбук упадёт с понятным сообщением.

- name: Install 1C backup health check
  hosts: lab_vm
  become: true

  vars:
    script_src: files/scripts/check_1c_backup.sh
    script_dest: /usr/local/bin/check_1c_backup.sh
    systemd_dir: /etc/systemd/system
    unit_files:
      - one-c-backup-health.service
      - one-c-backup-health.timer
    # Установить в true для первичной установки без бэкапа
    skip_health_check: false

  tasks:
    # ── Скрипт ──────────────────────────────────────────────────
    - name: Copy health check script
      ansible.builtin.copy:
        src: "{{ script_src }}"
        dest: "{{ script_dest }}"
        owner: root
        group: root
        mode: "0755"
      notify: Reload systemd

    # ── Unit-файлы ──────────────────────────────────────────────
    - name: Copy systemd unit files
      ansible.builtin.copy:
        src: "files/systemd/{{ item }}"
        dest: "{{ systemd_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ unit_files }}"
      notify: Reload systemd

    # ── Включение таймера ───────────────────────────────────────
    - name: Enable and start health timer
      ansible.builtin.systemd:
        name: one-c-backup-health.timer
        enabled: true
        state: started
        daemon_reload: true

    # ── Ручная проверка ─────────────────────────────────────────
    - name: Run health check to verify
      ansible.builtin.command: "{{ script_dest }}"
      become: true
      become_user: vboxuser
      register: health_result
      changed_when: false
      when: not skip_health_check

    - name: Show health check output
      ansible.builtin.debug:
        msg: "{{ health_result.stdout_lines | default(['(skipped)']) }}"
      when: not skip_health_check

    - name: Fail if health check did not pass
      ansible.builtin.fail:
        msg: |
          Health check failed (rc={{ health_result.rc | default('N/A') }}):
          {{ health_result.stderr_lines | default(['(no output)']) | join('\n') }}
          Если бэкапа ещё нет — запустите с: -e skip_health_check=true
      when:
        - not skip_health_check
        - health_result.rc | default(0) != 0

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

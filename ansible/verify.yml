- name: Verify lab VM configuration
  hosts: lab_vm
  gather_facts: true
  become: true

  tasks:
    - name: Verify OS and network facts
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - ansible_facts['distribution'] in ["Ubuntu", "Debian"]
          - ansible_facts['default_ipv4']['address'] is defined
          - ansible_facts['default_ipv4']['gateway'] is defined
        fail_msg: "Unexpected OS or network config"
        success_msg: "OS and network facts OK"

    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Verify required system services are running
      ansible.builtin.assert:
        that:
          - item in ansible_facts['services']
          - ansible_facts['services'][item]['state'] == "running"
        fail_msg: "Service {{ item }} missing or not running (state: {{ ansible_facts['services'][item]['state'] | default('NOT_FOUND') }})"
      loop:
        - docker.service
      # можно добавить ещё сервисов
    - name: Verify Docker is enabled at boot
      ansible.builtin.assert:
        that:
          - "'docker.service' in ansible_facts['services']"
          - ansible_facts['services']['docker.service']['state'] == "running"
          - ansible_facts['services']['docker.service']['status'] == "enabled"
        fail_msg: >-
          Docker must be running and enabled at boot.
          State: {{ ansible_facts['services']['docker.service']['state'] | default('NOT_FOUND') }},
          status: {{ ansible_facts['services']['docker.service']['status'] | default('NOT_FOUND') }}

    - name: Check Docker Compose availability
      become: false
      ansible.builtin.command:
        argv: [docker, compose, version]
      register: compose_version
      changed_when: false

    - name: Verify Docker Compose is available
      ansible.builtin.assert:
        that:
          - compose_version.rc == 0
          - "compose_version.stdout is search('version')"
        fail_msg: "Docker Compose unavailable: {{ compose_version.stderr | default('') }}"

    - name: Check HTTP health endpoint
      ansible.builtin.uri:
        url: https://127.0.0.1/api/health
        validate_certs: false
        return_content: true
      register: result

    - name: Verify API health and database status
      vars:
        health: "{{ result.content | from_json }}"
      ansible.builtin.assert:
        that:
          - result.status == 200
          - health.status == "ok"
          - health.database in ["ok", "connected", "healthy"]
        fail_msg: >-
          Health check failed. HTTP {{ result.status | default('unreachable') }}.
          Response: {{ result.content | default('empty') }}

  post_tasks:
    - name: Print verification summary
      ansible.builtin.debug:
        msg: |
          Host {{ inventory_hostname }} verified:
          - OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          - IP: {{ ansible_facts['default_ipv4']['address'] }}
          - Docker: running, enabled, Compose {{ compose_version.stdout | default('n/a') }}

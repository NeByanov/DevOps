- name: Configure lab VM
  hosts: lab_vm1
  gather_facts: true

  tasks:
    # Проверка ОС и сети — теперь через ansible_facts
    - name: Verify OS and network facts
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - ansible_facts['default_ipv4']['address'] is defined
          - ansible_facts['default_ipv4']['gateway'] is defined
        fail_msg: "Unexpected OS or network config"
        success_msg: "OS and network facts OK"

    - name: Populate service facts
      ansible.builtin.service_facts:

    # Более мягкая проверка: сначала смотрим, есть ли сервис вообще, потом — запущен ли он
    - name: Verify required services are present and running
      ansible.builtin.assert:
        that:
          - item in ansible_facts['services']
          - ansible_facts['services'][item]['state'] == "running"
        fail_msg: "Service {{ item }} missing or not running (state: {{ ansible_facts['services'][item]['state'] | default('NOT_FOUND') }})"
      loop:
        - docker.service
    #можно добавить доп строчки с сервисами

    - name: Check Docker Compose availability
      become: false
      ansible.builtin.command:
        argv: [docker, compose, version]
      register: compose_version
      changed_when: false

    - name: Verify Docker Compose available
      ansible.builtin.assert:
        that: compose_version.rc == 0
        fail_msg: "Docker Compose unavailable: {{ compose_version.stderr | default('') }}"

    - name: Check systemctl docker status
      ansible.builtin.command:
        cmd: systemctl status docker.service
      changed_when: false
      register: docker_compose
      failed_when: false

    - name: Verify Docker active
      ansible.builtin.assert:
        that:
          - "docker_compose.stdout is search('Active: active')"
          - "docker_compose.stdout is search('Loaded: loaded')"
        fail_msg: "Docker service not active/enabled"

    - name: Check HTTP health endpoint
      ansible.builtin.uri:
        url: https://127.0.0.1/api/health
        validate_certs: false
        return_content: true
      register: result

    - name: Verify health endpoint responds
      ansible.builtin.assert:
        that:
          - result.status == 200
          - result.content is search('ok')
        fail_msg: "Health endpoint failed: status {{ result.status | default('unreachable') }}"

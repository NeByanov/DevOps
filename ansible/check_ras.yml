---
- name: Configure and verify 1C RAS
  hosts: windows_hosts
  gather_facts: false

  tasks:

    - name: Query the cluster list through RAS
      ansible.windows.win_command:
        argv:
          - "{{ rac_executable }}"
          - cluster
          - list
          - "{{ ras_agent_address }}:{{ ras_port }}"
      register: rac_clusters
      changed_when: false
      check_mode: false

    - name: Extract cluster ID
      ansible.builtin.set_fact:
        cluster_id: >-
          {{
            (rac_clusters.stdout_lines
            | select('match', '^\s*cluster\s*:')
            | first
            | regex_replace('^\s*cluster\s*:\s*', ''))
          }}

    - name: Query the cluster info through RAS
      ansible.windows.win_command:
        argv:
          - "{{ rac_executable }}"
          - cluster
          - info
          - "{{ ras_agent_address }}:{{ ras_port }}"
          - "--cluster={{ cluster_id }}"
      register: rac_cluster_info
      changed_when: false
      check_mode: false

    - name: Query the server list through RAS
      ansible.windows.win_command:
        argv:
          - "{{ rac_executable }}"
          - server
          - list
          - "{{ ras_agent_address }}:{{ ras_port }}"
          - "--cluster={{ cluster_id }}"
      register: rac_server
      changed_when: false
      check_mode: false

    - name: Query the process list through RAS
      ansible.windows.win_command:
        argv:
          - "{{ rac_executable }}"
          - process
          - list
          - "{{ ras_agent_address }}:{{ ras_port }}"
          - "--cluster={{ cluster_id }}"
      register: rac_process
      changed_when: false
      check_mode: false

    - name: Query the session list through RAS
      ansible.windows.win_command:
        argv:
          - "{{ rac_executable }}"
          - session
          - list
          - "{{ ras_agent_address }}:{{ ras_port }}"
          - "--cluster={{ cluster_id }}"
      register: rac_session
      changed_when: false
      check_mode: false

    - name: Assert exactly one cluster exists
      ansible.builtin.assert:
        that:
          - rac_clusters.stdout_lines | select('match', '^\s*cluster\s*:') | list | length == 1
        fail_msg: "Ожидается ровно один кластер, найдено: {{ rac_clusters.stdout_lines | select('match', '^\\s*cluster\\s*:') | list | length }}"
        success_msg: "Кластер один — OK"

    - name: Assert at least one working server exists
      ansible.builtin.assert:
        that:
          - rac_server.stdout_lines | select('match', '^\s*server\s*:') | list | length >= 1
        fail_msg: "Рабочих серверов не найдено"
        success_msg: "Найдено серверов: {{ rac_server.stdout_lines | select('match', '^\\s*server\\s*:') | list | length }}"

    - name: Assert at least one working process exists
      ansible.builtin.assert:
        that:
          - rac_process.stdout_lines | select('match', '^\s*process\s*:') | list | length >= 1
        fail_msg: "Рабочих процессов (rphost) не найдено"
        success_msg: "Найдено процессов: {{ rac_process.stdout_lines | select('match', '^\\s*process\\s*:') | list | length }}"

    - name: Show cluster summary
      ansible.builtin.debug:
        msg:
          - "=== Кластер 1С ==="
          - "ID:       {{ cluster_id }}"
          - "Имя:      {{ rac_cluster_info.stdout_lines | select('match', '^\\s*name\\s*:') | first | regex_replace('^\\s*name\\s*:\\s*', '') }}"
          - "Хост:     {{ rac_cluster_info.stdout_lines | select('match', '^\\s*host\\s*:') | first | regex_replace('^\\s*host\\s*:\\s*', '') }}"
          - "Порт:     {{ rac_cluster_info.stdout_lines | select('match', '^\\s*port\\s*:') | first | regex_replace('^\\s*port\\s*:\\s*', '') }}"
          - "Серверов: {{ rac_server.stdout_lines | select('match', '^\\s*server\\s*:') | list | length }}"
          - "Процессов: {{ rac_process.stdout_lines | select('match', '^\\s*process\\s*:') | list | length }}"
          - "Сессий:   {{ rac_session.stdout_lines | select('match', '^\\s*session\\s*:') | list | length }}"

    - name: Show server details
      ansible.builtin.debug:
        msg: >-
          {{ item | regex_replace('^\s*(\S+)\s*:\s*(.*)$', '\1 = \2') }}
      loop: "{{ rac_server.stdout_lines | select('match', '^\\s*(server|host|port|using|alive)\\s*:') | list }}"

    - name: Show session details
      ansible.builtin.debug:
        msg: >-
          {{ item | regex_replace('^\s*(\S+)\s*:\s*(.*)$', '\1 = \2') }}
      loop: "{{ rac_session.stdout_lines | select('match', '^\\s*(session|user|app|infobase|host)\\s*:') | list }}"

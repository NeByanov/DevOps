---
- name: Windows preflight
  hosts: windows_hosts
  gather_facts: false

  tasks:
    - name: WinRM connectivity
      ansible.windows.win_ping:

    # --- 1. Учётная запись: существует, включена, не в Administrators ---
    - name: Query service account status
      ansible.windows.win_shell: |
        $user = Get-LocalUser -Name "{{ one_c_user }}" -ErrorAction SilentlyContinue
        $exists = $null -ne $user
        $enabled = $false
        $inAdmins = $false
        if ($exists) {
            $enabled = $user.Enabled
            $sid = $user.SID.Value
            $admins = Get-LocalGroupMember -Group Administrators -ErrorAction SilentlyContinue
            if ($admins) {
                $inAdmins = ($admins.SID.Value -contains $sid)
            }
        }
        [PSCustomObject]@{ exists=$exists; enabled=$enabled; in_admins=$inAdmins } | ConvertTo-Json -Compress
      register: user_query
      changed_when: false
      check_mode: false

    - name: Assert service account exists, enabled, not in Administrators
      ansible.builtin.assert:
        that:
          - (user_query.stdout | trim | from_json).exists | bool
          - (user_query.stdout | trim | from_json).enabled | bool
          - not ((user_query.stdout | trim | from_json).in_admins | bool)
        fail_msg: >-
          "Учётная запись {{ one_c_user }}: существует={{ (user_query.stdout | trim | from_json).exists }}, включена={{ (user_query.stdout | trim | from_json).enabled }}, в Administrators={{ (user_query.stdout | trim | from_json).in_admins }}"
        success_msg: "Учётная запись {{ one_c_user }}: OK"
        quiet: true

    # --- 2. Папки ---
    - name: Stat all required directories
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop: "{{ required_dirs }}"
      register: dirs_check
      changed_when: false

    - name: Assert all directories exist and are directories
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isdir | default(false)
        fail_msg: "Папка отсутствует или не является директорией: {{ item.item }}"
        success_msg: "Папка найдена: {{ item.item }}"
      loop: "{{ dirs_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- 3. SeServiceLogonRight ---
    - name: Check SeServiceLogonRight (read-only)
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users: "{{ svc_account }}"
        action: add
      check_mode: true
      register: right_check

    - name: Assert SeServiceLogonRight is assigned
      ansible.builtin.assert:
        that:
          - not (right_check.changed | bool)
        fail_msg: "SeServiceLogonRight отсутствует у {{ svc_account }}"
        success_msg: "SeServiceLogonRight OK"
        quiet: true

    # --- 4. Свободное место на системном диске ---
    - name: Get free space on C in GiB
      ansible.windows.win_shell: |
        $free = (Get-PSDrive C).Free / 1GB
        [int]$free
      register: free_space
      changed_when: false
      check_mode: false

    - name: Assert minimum free space on C
      ansible.builtin.assert:
        that:
          - free_space.stdout | trim | float >= one_c_min_free_gib | float
        fail_msg: "Недостаточно места на C: требуется {{ one_c_min_free_gib }} GiB, доступно {{ free_space.stdout | trim }} GiB"
        success_msg: "Свободное место на C: {{ free_space.stdout | trim }} GiB (требуется {{ one_c_min_free_gib }} GiB)"
        quiet: true

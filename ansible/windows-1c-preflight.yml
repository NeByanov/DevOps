---
- name: Windows preflight
  hosts: windows_hosts
  gather_facts: false

  vars:
    svc_account: "svc_1c_lab"
    required_dirs:
      - "C:\\1C-lab"
      - "C:\\1C-lab\\data"
      - "C:\\1C-lab\\logs"

  tasks:
    - name: WinRM connectivity
      ansible.windows.win_ping:

    # --- 1. Учётная запись: существует, включена, не в Administrators ---
    - name: Query service account status
      raw: |
        $user = Get-LocalUser -Name "{{ svc_account }}" -ErrorAction SilentlyContinue
        $exists = $null -ne $user
        $enabled = $false
        $inAdmins = $false
        if ($exists) {
            $enabled = $user.Enabled
            $sid = $user.SID.Value
            $admins = Get-LocalGroupMember -Group Administrators -ErrorAction SilentlyContinue
            if ($admins) {
                $inAdmins = ($admins.SID.Value -contains $sid)
            }
        }
        [PSCustomObject]@{ exists=$exists; enabled=$enabled; in_admins=$inAdmins } | ConvertTo-Json -Compress
      register: user_query
      changed_when: false

    - name: Assert service account exists, enabled, not in Administrators
      ansible.builtin.assert:
        that:
          - (user_query.stdout | from_json).exists | bool
          - (user_query.stdout | from_json).enabled | bool
          - not ((user_query.stdout | from_json).in_admins | bool)
        fail_msg: >-
          Учётная запись {{ svc_account }}:
          существует={{ (user_query.stdout | from_json).exists }},
          включена={{ (user_query.stdout | from_json).enabled }},
          в Administrators={{ (user_query.stdout | from_json).in_admins }}
        success_msg: "Учётная запись {{ svc_account }}: существует, включена, не в Administrators"
        quiet: true

    # --- 2. Папки: корневая, data, logs ---
    - name: Stat all required directories
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop: "{{ required_dirs }}"
      register: dirs_check
      changed_when: false

    - name: Assert all directories exist and are directories
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isdir | default(false)
        fail_msg: "Папка отсутствует или не является директорией: {{ item.item }}"
        success_msg: "Папка найдена: {{ item.item }}"
      loop: "{{ dirs_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- 3. SeServiceLogonRight ---
    - name: Check SeServiceLogonRight (read-only)
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users: "{{ svc_account }}"
        state: present
      check_mode: true
      register: right_check

    - name: Assert SeServiceLogonRight is assigned
      ansible.builtin.assert:
        that:
          - not (right_check.changed | bool)
        fail_msg: "SeServiceLogonRight отсутствует у {{ svc_account }} — право нужно назначить"
        success_msg: "SeServiceLogonRight назначен учётной записи {{ svc_account }}"
        quiet: true

    # --- 4. Свободное место на системном диске ---
    - name: Get free space on C in GiB
      raw: |
        $free = (Get-PSDrive C).Free / 1GB
        [int]$free
      register: free_space
      changed_when: false

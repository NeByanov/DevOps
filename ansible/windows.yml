- name: Create ansible-lab IIS website
  hosts: windows_hosts
  gather_facts: false
  become: false

  vars:
    site_name: ansible-lab
    site_path: C:\Sites\ansible-lab
    app_pool: ansible-lab-pool
    bind_ip: 192.168.56.103
    bind_port: 8081
    allowed_subnet: 192.168.56.0/24

  tasks:

    # ── 1. Папка сайта ──────────────────────────────────────────
    - name: Create site directory
      ansible.windows.win_file:
        path: "{{ site_path }}"
        state: directory

    # ── 2. Application Pool ──────────────────────────────────────
    # managedRuntimeVersion: '' → No Managed Code
    # processModel.identityType: ApplicationPoolIdentity → изолированный
    #   виртуальный аккаунт (по умолчанию для новых пулов, но задаём явно).
    # Требует PowerShell-модуль IISAdministration на целевом хосте.
    - name: Create application pool (ApplicationPoolIdentity, no .NET)
      microsoft.iis.web_app_pool:
        name: "{{ app_pool }}"
        state: started
        attributes:
          processModel.identityType: ApplicationPoolIdentity
          managedRuntimeVersion: ""

    # ── 3. HTML с маркером ───────────────────────────────────────
    - name: Deploy index.html with managed-by-ansible marker
      ansible.windows.win_copy:
        dest: "{{ site_path }}\\index.html"
        content: |
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <title>ansible-lab</title>
          </head>
          <body>
              <!-- managed-by-ansible -->
              <h1>ansible-lab</h1>
              <p>Site managed by Ansible.</p>
          </body>
          </html>

    # ── 4. IIS-сайт 192.168.56.103:8081 ──────────────────────────
    # microsoft.iis.website использует bindings.set для явного
    # указания списка привязок. Формат: список словарей с ip/port/protocol.
    - name: Create and start IIS site
      microsoft.iis.website:
        name: "{{ site_name }}"
        state: started
        physical_path: "{{ site_path }}"
        application_pool: "{{ app_pool }}"
        bindings:
          set:
            - ip: "{{ bind_ip }}"
              port: "{{ bind_port }}"
              protocol: http

    # ── 5. Firewall: TCP 8081 только из 192.168.56.0/24 ──────────
    # win_firewall_rule не deprecated — остаётся в community.windows.
    - name: Allow inbound TCP 8081 from lab subnet only
      community.windows.win_firewall_rule:
        name: Allow ansible-lab HTTP {{ bind_port }}
        enabled: true
        state: present
        direction: in
        action: allow
        protocol: tcp
        local_port: "{{ bind_port }}"
        remote_addresses: "{{ allowed_subnet }}"

    # ── 6. Проверка Default Web Site (без управления) ────────────
    - name: Assert Default Web Site is stopped
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $site = Get-IISSite -Name 'Default Web Site'
        if ($site.State -ne 'Stopped') {
            $msg = "Default Web Site is NOT stopped (current state: $($site.State)). " +
                   "This playbook does not manage it — please stop it manually."
            Write-Error $msg
            exit 1
        }
        Write-Output "Default Web Site is stopped."
      changed_when: false

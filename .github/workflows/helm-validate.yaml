name: helm-validation
on:
  push:
    branches: [ main ]
    paths:
      - 'kubernetes/charts/site-helm-demo/**'
      - '/home/vboxuser/dockerproject/Site/.github/workflows/helm-validate.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'kubernetes/charts/site-helm-demo/**'
      - '/home/vboxuser/dockerproject/Site/.github/workflows/helm-validate.yaml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm_validation:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Setup Helm v4.2.4
        uses: azure/setup-helm@v5
        with:
          version: '4.2.4' # по умолчанию используется последняя (стабильная) версия
        id: install

      - name: Validate configuration
        run: helm lint /home/vboxuser/dockerproject/Site/kubernetes/charts/site-helm-demo/

      - name: Render configuration
        run: |
          helm template /home/vboxuser/dockerproject/Site/kubernetes/charts/site-helm-demo -n site-helm-lab --output-dir ./rendered-manifest

      - name: Validate rendered manifests (grep)
        run: |
          set -euo pipefail
          OUT=$(helm template site-release ./site-helm-demo --namespace site-helm-lab)

          echo "$OUT" | grep -q "kind: ConfigMap"       && echo "OK: ConfigMap"
          echo "$OUT" | grep -q "replicas: 2"           && echo "OK: replicas=2"
          echo "$OUT" | grep -q "type: ClusterIP"       && echo "OK: ClusterIP"
          echo "$OUT" | grep -q "nginx:1.31.4"          && echo "OK: image"
          echo "$OUT" | grep -Eq "livenessProbe|readinessProbe|startupProbe" && echo "OK: probes"
          echo "$OUT" | grep -q "requests:" && echo "$OUT" | grep -q "limits:" && echo "OK: resources"

          echo "All render checks passed."

      - name: Проверяем rollout deployment
        run: |
          kubectl rollout status deployment/site-release --timeout=120s

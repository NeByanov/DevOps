name: helm-validation
on:
  push:
    branches: [ main ]
    paths:
      - 'kubernetes/charts/site-helm-demo/**'
      - '.github/workflows/helm-validate.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'kubernetes/charts/site-helm-demo/**'
      - '.github/workflows/helm-validate.yaml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Setup Helm v4.2.4
        uses: azure/setup-helm@v5
        with:
          version: '4.2.4'
        id: install

      - name: Validate configuration
        run: helm lint ./kubernetes/charts/site-helm-demo

      - name: Render configuration
        run: |
          helm template site-release ./kubernetes/charts/site-helm-demo -n site-helm-lab --output-dir ./rendered-manifest

      - name: Render lab-values.yaml
        run: |
          cd ./kubernetes/charts/site-helm-demo
          helm template site-release . -f values-lab.yaml

      - name: Validate HTTPRoute
        shell: bash
        run: |
          set -Eeuo pipefail

          CHART=./kubernetes/charts/site-helm-demo
          OUT=$(mktemp)
          trap 'rm -f "$OUT"' EXIT

          helm template site-release "$CHART" \
          --namespace site-helm-lab \
          -f "$CHART/values-lab.yaml" \
          --show-only templates/httproute.yaml > "$OUT"

          grep -q '^kind: HTTPRoute$' "$OUT"
          grep -q 'name: site-gateway' "$OUT"
          grep -q 'sectionName: http' "$OUT"
          grep -q 'site.gateway.test' "$OUT"
          grep -q 'name: site-release-site-helm-demo' "$OUT"
          grep -q 'port: 80' "$OUT"

          echo "HTTPRoute render is valid"

      - name: Validate rendered manifests (grep)
        run: |
          set -euo pipefail
          OUT=$(helm template site-release ./kubernetes/charts/site-helm-demo/ -n site-helm-lab)

          echo "$OUT" | grep -q "kind: ConfigMap"       && echo "OK: ConfigMap"
          echo "$OUT" | grep -q "replicas: 2"           && echo "OK: replicas=2"
          echo "$OUT" | grep -q "type: ClusterIP"       && echo "OK: ClusterIP"
          echo "$OUT" | grep -q "nginx:1.31.4"          && echo "OK: image"
          echo "$OUT" | grep -Eq "livenessProbe|readinessProbe|startupProbe" && echo "OK: probes"
          echo "$OUT" | grep -q "requests:" && echo "$OUT" | grep -q "limits:" && echo "OK: resources"

          echo "All render checks passed."

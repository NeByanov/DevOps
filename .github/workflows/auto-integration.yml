name: Auto integration
on: #[push,pull_request]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create isolated CI configuration
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=mysite
          POSTGRES_USER=app_owner
          POSTGRES_PASSWORD=ci-only-password-not-a-secret
          EOF

          mkdir -p nginx/certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout nginx/certs/site.key \
            -out nginx/certs/site.crt \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName = IP:127.0.0.1'
          chmod 600 nginx/certs/site.key

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build and start test stack
        run: docker compose up --build --detach

      - name: Wait until all services are healthy
        shell: bash
        run: |
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            all_healthy=true
            for service in postgres postgrest web nginx; do
              container_id="$(docker compose ps -q "$service")"
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing-healthcheck{{end}}' "$container_id" 2>/dev/null || true)"
              echo "$service: $status"
              if [[ "$status" != "healthy" ]]; then
                all_healthy=false
              fi
            done

            if [[ "$all_healthy" == true ]]; then
              exit 0
            fi
            sleep 2
          done

          echo 'The Compose stack did not become healthy in time.' >&2
          exit 1

      - name: Test HTTP redirect and HTTPS routes through Nginx
        shell: bash
        run: |
          http_headers="$(curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1/)"
          printf '%s\n' "$http_headers"
          grep -q '^HTTP/.* 301' <<<"$http_headers"
          grep -qi '^location: https://127.0.0.1/' <<<"$http_headers"

          curl --fail --silent --show-error --insecure https://127.0.0.1/ > /dev/null
          curl --fail --silent --show-error --insecure https://127.0.0.1/api/health | jq -e '.status == "ok"'
          curl --fail --silent --show-error --insecure https://127.0.0.1/api/tasks | jq -e '.tasks | type == "array"'

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Remove temporary test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

name: ansible-validate
on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-validate.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-validate.yaml'

  workflow_dispatch:

jobs:
  check:
    name: syntax-check

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up SSH
        run: |
          echo "${{ secrets.SSHPRIVATEKEY }}" > private_key.pem
          chmod 600 private_key.pem

     - name: Install Ansible
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y ansible

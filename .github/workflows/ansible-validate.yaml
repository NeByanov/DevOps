name: ansible-validate
on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-validate.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-validate.yaml'

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./ansible

jobs:
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Ansible and collections
        shell: bash
        run: |
          python -m pip install "ansible-core==2.21.3"
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax-Check
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          tmp_file=$(mktemp --tmpdir vault_pass_XXXXXX)
          echo "$ANSIBLE_VAULT_PASSWORD" > "$tmp_file"
          chmod 600 "$tmp_file"
          trap "rm -f '$tmp_file'" EXIT

          set -euo pipefail
          ansible-playbook --syntax-check site.yml -i inventory.yml --vault-password-file="$tmp_file"
          ansible-playbook --syntax-check verify.yml -i inventory.yml --vault-password-file="$tmp_file"
          ansible-playbook --syntax-check site-backup.yml -i inventory.yml --vault-password-file="$tmp_file"
          ansible-playbook --syntax-check verify-logrotate.yml -i inventory.yml --vault-password-file="$tmp_file"
          ansible-playbook --syntax-check sitessh.yml -i inventory.yml

  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: syntax-check

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run Ansible playbook
        env:
          PATH: /home/vboxuser/.local/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          ansible-playbook --version
          ansible-playbook verify.yml -i inventory.yml
          ansible-playbook verify-logrotate.yml -i inventory.yml

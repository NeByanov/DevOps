name: ansible-validate
on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-validate.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-validate.yaml'

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./ansible

jobs:
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Ansible
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Syntax-Check
        run: |
          set -euo pipefail
          ansible-playbook --syntax-check site.yml -i inventory.yml
          ansible-playbook --syntax-check verify.yml -i inventory.yml
          ansible-playbook --syntax-check site-backup.yml -i inventory.yml
          ansible-playbook --syntax-check verify-logrotate.yml -i inventory.yml

  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: syntax-check

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run Ansible playbook
        env:
          PATH: /home/vboxuser/.local/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          ansible-playbook --version
          ansible-playbook verify.yml -i inventory.yml
          ansible-playbook verify-logrotate.yml -i inventory.yml

name: windows-service
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./ansible

jobs:
  windows-service:
    name: syntax-check
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
    - name: Check out source
      uses: actions/checkout@v6

    - name: Write vault password file
      run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

    - name: Confirm pipx Ansible is used
      run: |
        echo "PATH=$PATH"
        which ansible-playbook || echo "ansible-playbook not found via PATH"
        /home/vboxuser/.local/bin/ansible-playbook --version

    - name: Start windows-service.yml
      run: |
        /home/vboxuser/.local/bin/ansible-playbook windows-service.yml \
        -i inventory.yml \
        --vault-password-file /tmp/vault_pass.txt \
        --check
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f /tmp/vault_pass.txt

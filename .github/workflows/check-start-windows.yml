name: windows-service
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./ansible

jobs:
  windows-service:
    name: syntax-check
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
    - name: Check out source
      uses: actions/checkout@v6

    - name: Write vault password file
      run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

      - name: Validate Ansible environment (path + version + python)
        run: |
          echo "=== PATH ==="
          echo "$PATH"
          echo
          echo "=== which ansible-playbook ==="
          which ansible-playbook || echo "NOT FOUND"
          echo
          echo "=== ansible --version ==="
          ansible --version || echo "ANSIBLE FAILED"
          echo
          echo "=== which python ==="
          which python

    - name: Start windows-service.yml
      run: |
        /home/vboxuser/.local/bin/ansible-playbook windows-service.yml \
        -i inventory.yml \
        --vault-password-file /tmp/vault_pass.txt \
        --check
    - name: Cleanup secrets
      if: always()
      run: |
        rm -f /tmp/vault_pass.txt

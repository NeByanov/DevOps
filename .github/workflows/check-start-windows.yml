name: windows-service
on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/check-start-windows.yaml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./ansible

jobs:
  windows-service:
    name: windows-service
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
    - name: Check out source
      uses: actions/checkout@v6

    - name: Check ansible version
      run: /home/vboxuser/.local/bin/ansible --version

    - name: Run playbook with vault
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      run: |
        tmp_file=$(mktemp --tmpdir vault_pass_XXXXXX)
        echo "$ANSIBLE_VAULT_PASSWORD" > "$tmp_file"
        chmod 600 "$tmp_file"
        trap "rm -f '$tmp_file'" EXIT

        /home/vboxuser/.local/bin/ansible-playbook \
          -i inventory.yml \
          windows-verify.yml \
          --check \
          --vault-password-file="$tmp_file"


name: Production deploy

on:
  workflow_dispatch:
    branches:
      - main
    inputs:
      image_digest:
        description: "GHCR image digest (sha256:<64 hex>)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production-deploy:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy web to production
        working-directory: /home/vboxuser/dockerproject/Site
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          ./deploy-web.sh "$IMAGE_DIGEST"

      - name: Test HTTP redirect and HTTPS routes through Nginx
        shell: bash
        run: |
          http_headers="$(curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1/)"
          printf '%s\n' "$http_headers"
          grep -q '^HTTP/.* 301' <<<"$http_headers"
          grep -qi '^location: https://127.0.0.1/' <<<"$http_headers"

          curl --fail --silent --show-error --insecure https://127.0.0.1/ > /dev/null
          curl --fail --silent --show-error --insecure https://127.0.0.1/api/health | jq -e '.status == "ok"'
          curl --fail --silent --show-error --insecure https://127.0.0.1/api/tasks | jq -e '.tasks | type == "array"'

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

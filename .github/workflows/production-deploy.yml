name: Production deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "GHCR image digest (sha256:<64 hex>)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production-deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy web to production
        working-directory: /home/vboxuser/dockerproject/Site
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          ./deploy-web.sh "$IMAGE_DIGEST"


name: opentofu-apply

on:
  workflow_dispatch:
    branches:
      - main

concurrency:
  group: opentofu
  cancel-in-progress: false

jobs:
  tofu-apply:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check branch is main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Ошибка: разрешено запускать только из ветки main."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v6

      - name: Init and validate
        working-directory: ./opentofu/docker-lab
        run: |
          tofu --version
          tofu init
          tofu fmt -check -recursive
          tofu validate

      - name: Build Plan
        id: plan
        working-directory: ./opentofu/docker-lab
        run: |
          set +e
          tofu plan -out=tfplan -detailed-exitcode
          PLAN_EXIT=$?
          set -e
          
          echo "plan_exit=$PLAN_EXIT" >> $GITHUB_OUTPUT
          
          if [ "$PLAN_EXIT" -eq 0 ]; then
            echo "Нет изменений (exit 0)."
          elif [ "$PLAN_EXIT" -eq 2 ]; then
            echo "Есть изменения (exit 2). План сохранён в tfplan."
          else
            echo "Ошибка plan (exit $PLAN_EXIT)."
            exit 1
          fi

      - name: Apply Saved Plan
        if: steps.plan.outputs.plan_exit == '2'
        working-directory: ./opentofu/docker-lab
        run: tofu apply -auto-approve tfplan

      - name: Cleanup Plan File
        if: always()
        working-directory: ./opentofu/docker-lab
        run: rm -f tfplan

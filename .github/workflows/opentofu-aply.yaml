name: opentofu-apply
on:
  workflow_dispatch:

concurrency:
  group: opentofu
  cancel-in-progress: false
defaults:
  run:
    working-directory: ./opentofu/docker-lab
jobs:
  tofu-apply:
    name: plan-check
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check branch is main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Ошибка: разрешено запускать только из ветки main."
            echo "Текущая (выбранная) ветка: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v6
      - name: Check all config and format
        run: |
          tofu --version
          tofu init
          tofu state list
          tofu plan -detailed-exitcode
          tofu fmt -check -recursive
          tofu validate

      - name: Build Plan
        id: plan
        run: |
          tofu plan -out=tfplan -detailed-exitcode
          PLAN_EXIT=$?
          echo "plan_exit=$PLAN_EXIT" >> $GITHUB_OUTPUT
          if [ "$PLAN_EXIT" -eq 0 ]; then
            echo "Нет изменений (exit 0)."
          elif [ "$PLAN_EXIT" -eq 2 ]; then
            echo "Есть изменения (exit 2). План сохранён в tfplan."
          else
            echo "Ошибка plan (exit $PLAN_EXIT)."
            exit 1
          fi

      - name: Apply Saved Plan
        if: steps.plan.outputs.plan_exit == '2'
        run: tofu apply -auto-approve tfplan

      - name: Cleanup Plan File
        if: always()
        run: rm -f tfplan

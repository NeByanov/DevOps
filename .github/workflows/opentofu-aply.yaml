name: opentofu-apply
on:
  workflow_dispatch:

concurrency:
  group: opentofu
  cancel-in-progress: false
defaults:
  run:
    working-directory: ./opentofu/docker-lab
jobs:
  tofu-apply:
    name: plan-check
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check branch is main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Ошибка: разрешено запускать только из ветки main."
            echo "Текущая (выбранная) ветка: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v6
      - name: Check all config and format
        run: |
          tofu --version
          tofu init
          tofu state list
          tofu plan -detailed-exitcode
          tofu fmt -check -recursive
          tofu validate

      - name: Generate Plan
        run: |
          echo "Running tofu plan..."
          # Флаг -out обязателен! Без него apply не сработает.
          tofu plan -out=tfplan
          
          EXIT_CODE=$?
          
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::notice::Infrastructure is up-to-date. No changes needed."
            # Можно даже пропустить apply, но для простоты оставим
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "::notice::Changes detected (code 2). Plan file 'tfplan' created. Moving to apply..."
            # Важно: НЕ делаем exit 1, чтобы job пошел дальше
          else
            echo "::error::Plan failed unexpectedly (code $EXIT_CODE)"
            exit 1
          fi

      # 6. Apply (сработает только если шаг 5 не вернул exit 1)
      - name: Apply Changes
        run: tofu apply -auto-approve tfplan

      # 7. Очистка
      - name: Cleanup Plan File
        if: always()
        run: rm -f tfplan

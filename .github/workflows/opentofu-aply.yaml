name: opentofu-apply

on:
  workflow_dispatch:

concurrency:
  group: opentofu
  cancel-in-progress: false

jobs:
  tofu-apply:
    name: Apply
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check branch is main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Разрешено запускать только из ветки main."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v6

      - name: Init
        working-directory: ./opentofu/docker-lab
        run: tofu init -input=false

      - name: Format check
        working-directory: ./opentofu/docker-lab
        run: tofu fmt -check -recursive

      - name: Validate
        working-directory: ./opentofu/docker-lab
        run: tofu validate

      - name: Build plan
        id: plan
        working-directory: ./opentofu/docker-lab
        run: |
          set +e
          tofu plan -out=tfplan -input=false -detailed-exitcode
          PLAN_EXIT=$?
          set -e
          echo "plan_exit=$PLAN_EXIT" >> $GITHUB_OUTPUT

          case "$PLAN_EXIT" in
            0)
              echo "::notice::Нет изменений — apply не требуется."
              ;;
            2)
              echo "::notice::Обнаружены изменения. План сохранён в tfplan, переходим к apply."
              ;;
            *)
              echo "::error::Ошибка plan (exit code $PLAN_EXIT)."
              exit 1
              ;;
          esac

      - name: Apply saved plan
        if: steps.plan.outputs.plan_exit == '2'
        working-directory: ./opentofu/docker-lab
        run: tofu apply -input=false -auto-approve tfplan

      - name: Skip apply (no changes)
        if: steps.plan.outputs.plan_exit == '0'
        run: echo "::notice::Шаг apply пропущен — изменений нет."

      - name: Check state after apply
        if: steps.plan.outputs.plan_exit == '2'
        working-directory: ./opentofu/docker-lab
        run: |
          echo "=== State list после apply ==="
          set -e
          StateCode=$(tofu state list)

          grep -qF "docker_container.tofu_lab_web" <<< "$OUTPUT"
          grep -qF "docker_image.nginx" <<< "$OUTPUT"
          grep -qF "docker_network.tofu_lab" <<< "$OUTPUT"
          echo "Все ресурсы на месте"
      - name: HTTP endpoint check
        if: steps.plan.outputs.plan_exit == '2'
        working-directory: ./opentofu/docker-lab
        run: |
          echo "=== Проверка HTTP-эндпоинта ==="
          CODE=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/ || true)
          echo "HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Эндпоинт вернул $CODE, ожидался 200."
            exit 1
          fi

      - name: Cleanup plan file
        if: always()
        working-directory: ./opentofu/docker-lab
        run: rm -f tfplan

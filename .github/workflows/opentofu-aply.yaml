name: opentofu-apply
on:
  workflow_dispatch:

concurrency:
  group: opentofu
  cancel-in-progress: false
defaults:
  run:
    working-directory: ./opentofu/docker-lab
jobs:
  tofu-apply:
    name: plan-check
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check branch is main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Ошибка: разрешено запускать только из ветки main."
            echo "Текущая (выбранная) ветка: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v6
      - name: Check all config and format
        run: |
          tofu --version
          tofu init
          tofu state list
          tofu plan -detailed-exitcode
          tofu fmt -check -recursive
          tofu validate

      - name: Build Plan
        run: |
          # Строим план и сохраняем в файл.
          # Даже если есть изменения (exit 2), файл tfplan будет создан.
          tofu plan -out=tfplan

          # Опционально: логируем, что изменения есть, но не ломаем job
          if [ $? -eq 2 ]; then
            echo "::notice::Plan has changes (exit code 2). Review the plan before applying."
          elif [ $? -ne 0 ]; then
            echo "::error::Plan failed with unexpected error."
            exit 1
          fi

      - name: Apply Saved Plan
        run: tofu apply -auto-approve tfplan

      - name: Cleanup Plan File
        if: always()
        run: rm -f tfplan


apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-demo
  namespace: site-lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: site-demo
  template:
    metadata:
      labels:
        app: site-demo
    spec:
      containers:
      - name: site-demo-container
        image: nginx:1.31.4
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "256M"
            cpu: "2"
          limits:
            memory: "512M"
            cpu: "4"
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: html-volume
        configMap:
          name: site-content
---
apiVersion: v1
kind: Service
metadata:
  name: site-demo
  namespace: site-lab
spec:
  type: ClusterIP
  selector:
    app: site-demo
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80

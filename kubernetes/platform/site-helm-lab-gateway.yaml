apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: site-gateway
  namespace: site-helm-lab
  labels:
    app.kubernetes.io/name: site-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: site-platform
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      hostname: site.gateway.test
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
